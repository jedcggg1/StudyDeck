<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Neo Brutalist 3D Stacked Deck -->
  <!-- Bottom card shadow -->
  <polygon points="24,68 76,68 86,52 34,52" fill="#111111" />
  <!-- Bottom card -->
  <polygon points="20,64 72,64 82,48 30,48" fill="#1769FF" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <!-- Middle card -->
  <polygon points="20,50 72,50 82,34 30,34" fill="#3B82F6" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <!-- Top card -->
  <polygon points="20,36 72,36 82,20 30,20" fill="#60A5FA" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner flashcard highlight -->
  <line x1="34" y1="28" x2="68" y2="28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
